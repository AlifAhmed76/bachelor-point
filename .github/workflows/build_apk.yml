name: Build Bachelor Point Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter Project & Inject Complete Code
        run: |
          flutter create --org com.bachelorpoint --project-name bachelor_point .
          dart run setup_project.dart

      - name: Auto-Match Firebase Package Name & Patch Android Gradle
        run: |
          python3 - << 'EOF'
          import os, re, json, shutil

          gs_file = None
          for candidate in ['google-services.json', 'android/app/google-services.json']:
              if os.path.exists(candidate):
                  gs_file = candidate
                  break

          pkg_name = 'com.bachelorpoint.app'
          if gs_file:
              with open(gs_file, 'r') as f:
                  data = json.load(f)
              try:
                  pkg_name = data['client'][0]['client_info']['android_client_info']['package_name']
                  print(f"Detected Firebase package_name: {pkg_name}")
              except Exception as e:
                  print(f"Using default package name: {e}")
              shutil.copy(gs_file, 'android/app/google-services.json')
          else:
              print("WARNING: google-services.json not found!")

          for s_path in ['android/settings.gradle', 'android/settings.gradle.kts']:
              if os.path.exists(s_path):
                  with open(s_path, 'r') as f:
                      txt = f.read()
                  if 'com.google.gms.google-services' not in txt:
                      if s_path.endswith('.kts'):
                          txt = txt.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false')
                      else:
                          txt = txt.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false')
                  with open(s_path, 'w') as f:
                      f.write(txt)

          for b_path in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(b_path):
                  with open(b_path, 'r') as f:
                      txt = f.read()
                  if 'com.google.gms.google-services' not in txt:
                      if b_path.endswith('.kts'):
                          txt = txt.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")')
                      else:
                          txt = txt.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"')

                  txt = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 23', txt)
                  txt = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', txt)
                  txt = re.sub(r'applicationId\s*=?\s*["\']com\.bachelorpoint\.bachelor_point["\']', f'applicationId = "{pkg_name}"', txt)
                  with open(b_path, 'w') as f:
                      f.write(txt)
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bachelor-Point-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
